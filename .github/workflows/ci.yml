name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # The Codex kernel builds with the toolchain pinned in apps/web/codex-kernel/rust-toolchain.toml.
      - run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
